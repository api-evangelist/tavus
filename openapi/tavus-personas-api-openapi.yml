                              type: object
                              description: '**Note**: Turn-taking is now configured on the [Conversational Flow layer](/sections/conversational-video-interface/persona/conversational-flow).

                                '
                              properties:
                                stt_engine:
                                  type: string
                                  description: The STT engine used for transcription. `tavus-auto` (default, recommended) automatically selects the best model. `tavus-parakeet` offers highest throughput for English and European languages. `tavus-soniox` is purpose-built for Indian languages. `tavus-whisper` provides broad multilingual coverage. `tavus-deepgram-medical` is optimized for clinical vocabulary (English only). `tavus-advanced` is deprecated.
                                  enum:
                                  - tavus-auto
                                  - tavus-parakeet
                                  - tavus-soniox
                                  - tavus-whisper
                                  - tavus-deepgram-medical
                                  - tavus-advanced
                                  default: tavus-auto
                                  example: tavus-auto
                                hotwords:
                                  type: string
                                  description: The hotwords that will be used for the STT engine.
