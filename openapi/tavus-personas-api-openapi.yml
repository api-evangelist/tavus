    patch:
      tags:
      - Personas
      summary: Patch Persona
      description: This endpoint allows you to update specific fields of a persona using JSON Patch operations.
      operationId: patchPersona
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  op:
                    type: string
                    description: 'The operation to perform. Must be one of: add, remove, replace, copy, move, test'
                    enum:
                    - add
                    - remove
                    - replace
                    - copy
                    - move
                    - test
                    example: add
                  path:
                    type: string
                    description: 'JSON Pointer (RFC 6901) to a location in the persona document. Paths must match the **current** document shape—compare the response from [Get Persona](/api-reference/personas/get-persona) (`GET /v2/personas/{persona_id}`) before patching.

                      '
                    example: /layers/llm/model
                  value:
                    type: string
                    description: The value to be used within the operation. **This field is not required for the `remove` operation**.
                    example: tavus-llama-4
                required:
                - op
                - path
                - value
            examples:
              Replace Persona System Prompt:
                value:
                - op: replace
                  path: /system_prompt
                  value: As a Life Coach, you are a dedicated professional who specializes in...
              Remove STT Hotwords:
                value:
                - op: remove
                  path: /layers/stt/hotwords
      responses:
        '200':
          description: OK
        '304':
          description: No changes were made to the persona
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                    example: No changes were made to the persona
