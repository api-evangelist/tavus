                properties:
                  error:
                    type: string
                    description: The error message.
                    example: Invalid persona_id
        '422':
          description: Invalid JSON patch format
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                    example: Invalid JSON patch format
