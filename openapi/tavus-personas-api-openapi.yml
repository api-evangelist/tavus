    get:
      tags:
      - Personas
      summary: Get Persona
      description: 'This endpoint returns a single persona by its unique identifier.

        '
      operationId: getPersona
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
